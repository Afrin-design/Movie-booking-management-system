{% extends "admin/base_admin.html" %}
{% block title %}{{ action }} Movie – Admin{% endblock %}
{% block page_title %}{{ action }} Movie{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="d-flex align-items-center gap-2 mb-4">
      <a href="{{ url_for('admin.movies') }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left-short fs-5"></i></a>
      <h5 class="fw-bold mb-0" style="font-family:'Poppins',sans-serif;">{{ action }} Movie</h5>
    </div>
    <div class="bms-card p-4">
      <form method="POST" novalidate>
        <div class="mb-3">
          <label class="form-label fw-semibold">Title <span class="text-primary">*</span></label>
          <input type="text" name="title" class="form-control" value="{{ movie.title if movie else '' }}" placeholder="e.g. Avengers: Endgame" required>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Genre</label>
            <select name="genre" class="form-select">
              <option value="">Select genre</option>
              {% for g in ['Action','Comedy','Drama','Horror','Romance','Sci-Fi','Thriller','Animation','Documentary','Fantasy'] %}
              <option value="{{ g }}" {{ 'selected' if movie and movie.genre == g }}>{{ g }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Language</label>
            <select name="language" class="form-select">
              <option value="">Select language</option>
              {% for l in ['Hindi','English','Tamil','Telugu','Malayalam','Kannada','Bengali','Marathi'] %}
              <option value="{{ l }}" {{ 'selected' if movie and movie.language == l }}>{{ l }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label fw-semibold">Duration (mins)</label>
            <input type="number" name="duration" class="form-control" value="{{ movie.duration if movie else '' }}" placeholder="120" min="30" max="360">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Rating (0–10)</label>
            <input type="number" name="rating" class="form-control" value="{{ movie.rating if movie else '' }}" placeholder="7.5" min="0" max="10" step="0.1">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Release Date</label>
            <input type="date" name="release_date" class="form-control" value="{{ movie.release_date.isoformat() if movie and movie.release_date else '' }}">
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Description</label>
          <textarea name="description" class="form-control" rows="3" placeholder="Short synopsis…">{{ movie.description if movie else '' }}</textarea>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary px-4"><i class="fa-solid fa-check me-1"></i>{{ action }} Movie</button>
          <a href="{{ url_for('admin.movies') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
