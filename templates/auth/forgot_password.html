{% extends "base.html" %}
{% block title %}Forgot Password – CineHub{% endblock %}
{% block content %}
<div style="min-height:85vh;background:linear-gradient(135deg,#070B14 0%,#0D1425 50%,#111A33 100%);display:flex;align-items:center;justify-content:center;padding:40px 20px;">
  <div style="width:420px;max-width:100%;">
    <div class="text-center mb-4">
      <div style="font-family:'Poppins',sans-serif;font-size:2rem;font-weight:800;color:#fff;">Cine<span style="color:#3B82F6;">Hub</span></div>
    </div>
    <div class="auth-card">
      <div class="text-center mb-4">
        <div style="width:60px;height:60px;background:var(--bms-primary-l);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
          <i class="bi bi-envelope-open" style="font-size:1.6rem;color:#3B82F6;"></i>
        </div>
        <h4 style="font-family:'Poppins',sans-serif;font-weight:700;color:#F0F4FF;">Forgot Password?</h4>
        <p style="color:rgba(200,215,255,.5);font-size:.85rem;">Enter your email and we'll send you a temporary password.</p>
      </div>
      <form method="POST" novalidate>
        <div class="mb-4">
          <label class="form-label fw-semibold small">Email Address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required autofocus>
          </div>
        </div>
        <button type="submit" class="btn-primary-bms w-100" style="padding:12px;border:none;border-radius:12px;cursor:pointer;font-family:'Poppins',sans-serif;">
          <i class="bi bi-send me-2"></i>Send Temporary Password
        </button>
      </form>
      <p class="text-center mt-3 mb-0" style="font-size:.85rem;color:rgba(200,215,255,.5);">
        Remember it? <a href="{{ url_for('auth.login') }}" style="color:#3B82F6;font-weight:600;">Back to Login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
